name: Build and deploy VICEWIRE

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'source-art/**'
      - 'source-css/**'
      - 'dist/**'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build all GTA 6 and gaming pages
        run: python scripts/build_multigame.py
      - name: Validate routes, SEO, links, images and sitemap
        run: python scripts/qa_v4.py
      - name: Upload verified static site
        uses: actions/upload-artifact@v4
        with:
          name: vicewire-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to existing Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: vicewire-dist
          path: dist
      - name: Deploy VICEWIRE to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vicewire --branch=main
      - name: Explain missing credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo '::warning::GitHub build passed; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable automatic deployment.'
